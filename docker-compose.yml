services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rpa
      POSTGRES_PASSWORD: rpa
      POSTGRES_DB: rpa
    volumes:
      - omnipanel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpa"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file:
      - .env
    environment:
      RAP_DATABASE_URL: postgresql+asyncpg://rpa:rpa@db:5432/rpa
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAP_DATABASE_URL: postgresql+asyncpg://rpa:rpa@db:5432/rpa
      BACKUP_DIR: /app/backups
    volumes:
      - omnipanel_backups:/app/backups
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  omnipanel_pgdata:
  omnipanel_backups:
