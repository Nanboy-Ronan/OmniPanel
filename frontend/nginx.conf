server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / { return 302 /console/$is_args$args; }
    location = /console { return 302 /console/$is_args$args; }
    location = /favicon.ico { return 302 /console/favicon.svg; }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control no-store always;
    }

    location /console/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /console/ {
        try_files $uri $uri/ /console/index.html;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self' about:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }
    location / { return 404; }
}
