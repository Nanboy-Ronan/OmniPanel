[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "omnipanel-collector-login"
version = "1.0.1"
description = "Local login repair for the omnipanel data platform"
requires-python = ">=3.10"
dependencies = ["playwright==1.60.0"]
[project.scripts]
rpa-collector-login = "rpa_collector_login.cli:main"
[tool.setuptools.packages.find]
include = ["rpa_collector_login*"]
